<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 320" role="img" aria-label="CICD Pipeline Overview">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0f141b" />
      <stop offset="1" stop-color="#151b24" />
    </linearGradient>
    <linearGradient id="ember" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ff8a4c" />
      <stop offset="1" stop-color="#e35a2a" />
    </linearGradient>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M0 0 L10 5 L0 10 z" fill="#ff8a4c" />
    </marker>
  </defs>

  <rect width="1200" height="320" fill="url(#bg)" rx="16" />

  <!-- title -->
  <text x="40" y="36" fill="#e9e2d1" font-family="JetBrains Mono, monospace" font-size="12" letter-spacing="2">
    CICD PIPELINE OVERVIEW
  </text>
  <text x="40" y="68" fill="#e9e2d1" font-family="Newsreader, serif" font-size="24" font-weight="600">
    Push &gt; Image &gt; Deploy &gt; Backup
  </text>

  <!-- PUSH card -->
  <g transform="translate(100, 100)">
    <rect width="230" height="130" rx="10" fill="#1a2230" stroke="#2a3344" />
    <line x1="0" y1="0" x2="230" y2="0" stroke="url(#ember)" stroke-width="3" />
    <text x="16" y="36" fill="#ff8a4c" font-family="JetBrains Mono, monospace" font-size="14" font-weight="600">PUSH</text>
    <text x="16" y="62" fill="#e9e2d1" font-family="Inter Tight, sans-serif" font-size="12">git push origin main</text>
    <text x="16" y="82" fill="#e9e2d1" font-family="Inter Tight, sans-serif" font-size="12">triggers deploy.yml</text>
    <text x="16" y="112" fill="#a8a097" font-family="Inter Tight, sans-serif" font-size="11">Where: Local dev</text>
  </g>

  <!-- ACR card -->
  <g transform="translate(356, 100)">
    <rect width="230" height="130" rx="10" fill="#1a2230" stroke="#2a3344" />
    <line x1="0" y1="0" x2="230" y2="0" stroke="url(#ember)" stroke-width="3" />
    <text x="16" y="36" fill="#ff8a4c" font-family="JetBrains Mono, monospace" font-size="14" font-weight="600">ACR</text>
    <text x="16" y="62" fill="#e9e2d1" font-family="Inter Tight, sans-serif" font-size="12">BuildKit builds image</text>
    <text x="16" y="82" fill="#e9e2d1" font-family="Inter Tight, sans-serif" font-size="12">pushes 3 tags</text>
    <text x="16" y="112" fill="#a8a097" font-family="Inter Tight, sans-serif" font-size="11">Where: GH runner</text>
  </g>

  <!-- DEPLOY card -->
  <g transform="translate(612, 100)">
    <rect width="230" height="130" rx="10" fill="#1a2230" stroke="#2a3344" />
    <line x1="0" y1="0" x2="230" y2="0" stroke="url(#ember)" stroke-width="3" />
    <text x="16" y="36" fill="#ff8a4c" font-family="JetBrains Mono, monospace" font-size="14" font-weight="600">DEPLOY</text>
    <text x="16" y="62" fill="#e9e2d1" font-family="Inter Tight, sans-serif" font-size="12">SSH pulls :latest</text>
    <text x="16" y="82" fill="#e9e2d1" font-family="Inter Tight, sans-serif" font-size="12">compose up -d</text>
    <text x="16" y="112" fill="#a8a097" font-family="Inter Tight, sans-serif" font-size="11">Where: Cloud server</text>
  </g>

  <!-- BACKUP card -->
  <g transform="translate(868, 100)">
    <rect width="230" height="130" rx="10" fill="#1a2230" stroke="#2a3344" />
    <line x1="0" y1="0" x2="230" y2="0" stroke="url(#ember)" stroke-width="3" />
    <text x="16" y="36" fill="#ff8a4c" font-family="JetBrains Mono, monospace" font-size="14" font-weight="600">BACKUP</text>
    <text x="16" y="62" fill="#e9e2d1" font-family="Inter Tight, sans-serif" font-size="12">Daily pg_dump</text>
    <text x="16" y="82" fill="#e9e2d1" font-family="Inter Tight, sans-serif" font-size="12">14-day retention</text>
    <text x="16" y="112" fill="#a8a097" font-family="Inter Tight, sans-serif" font-size="11">Where: Cloud server</text>
  </g>

  <!-- arrows between cards -->
  <g stroke="url(#ember)" stroke-width="2" fill="none" marker-end="url(#arrow)">
    <path d="M330 165 L348 165" />
    <path d="M586 165 L604 165" />
    <path d="M842 165 L860 165" />
  </g>

  <!-- legend section -->
  <g transform="translate(40, 262)">
    <rect width="1120" height="44" rx="8" fill="#1a2230" stroke="#2a3344" />
    <text x="16" y="18" fill="#a8a097" font-family="Inter Tight, sans-serif" font-size="11">
      PUSH/03 | ACR/02 | DEPLOY/02-03 | BACKUP/03 + ops workflow
    </text>
    <text x="16" y="36" fill="#5c544a" font-family="Inter Tight, sans-serif" font-size="11">
      The 17 documented pitfalls (chapter 04) all sit somewhere along this pipeline.
    </text>
  </g>
</svg>
