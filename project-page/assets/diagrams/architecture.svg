<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 640" role="img" aria-label="PracticeClient API Prisma 架构图">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0f141b" />
      <stop offset="1" stop-color="#151b24" />
    </linearGradient>
    <linearGradient id="ember" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ff8a4c" />
      <stop offset="1" stop-color="#e35a2a" />
    </linearGradient>
  </defs>

  <rect width="1200" height="640" fill="url(#bg)" rx="16" />

  <!-- title -->
  <text x="40" y="56" fill="#e9e2d1" font-family="JetBrains Mono, monospace" font-size="14" letter-spacing="2">
    YASI WORDS · RUNTIME FLOW
  </text>
  <text x="40" y="92" fill="#e9e2d1" font-family="Newsreader, serif" font-size="28" font-weight="600">
    Browser → API → Prisma → Postgres
  </text>

  <!-- Lane labels -->
  <text x="40" y="160" fill="#5c544a" font-family="JetBrains Mono, monospace" font-size="11" letter-spacing="2">
    BROWSER
  </text>
  <text x="380" y="160" fill="#5c544a" font-family="JetBrains Mono, monospace" font-size="11" letter-spacing="2">
    NEXT.JS ROUTE HANDLERS
  </text>
  <text x="780" y="160" fill="#5c544a" font-family="JetBrains Mono, monospace" font-size="11" letter-spacing="2">
    DATA LAYER
  </text>

  <!-- Browser card -->
  <g transform="translate(40,180)">
    <rect width="280" height="120" rx="12" fill="#1a2230" stroke="#2a3344" />
    <text x="20" y="32" fill="#ff8a4c" font-family="JetBrains Mono, monospace" font-size="13" font-weight="600">
      PracticeClient
    </text>
    <text x="20" y="58" fill="#e9e2d1" font-family="JetBrains Mono, monospace" font-size="12">
      src/app/practice/[wordbook]/practice-client.tsx
    </text>
    <text x="20" y="86" fill="#a8a097" font-family="Inter Tight, sans-serif" font-size="12">
      Word history · streak · queue refill
    </text>
    <text x="20" y="104" fill="#a8a097" font-family="Inter Tight, sans-serif" font-size="12">
      Web Audio API · Audio fallback
    </text>
  </g>

  <!-- API row -->
  <g transform="translate(380,180)">
    <rect width="360" height="60" rx="10" fill="#1a2230" stroke="#2a3344" />
    <text x="16" y="26" fill="#ff8a4c" font-family="JetBrains Mono, monospace" font-size="12" font-weight="600">
      GET /api/words
    </text>
    <text x="16" y="46" fill="#a8a097" font-family="Inter Tight, sans-serif" font-size="11">
      PULL_CONFIG[priority] → batch of 20
    </text>
  </g>
  <g transform="translate(380,250)">
    <rect width="360" height="60" rx="10" fill="#1a2230" stroke="#2a3344" />
    <text x="16" y="26" fill="#ff8a4c" font-family="JetBrains Mono, monospace" font-size="12" font-weight="600">
      POST /api/attempts
    </text>
    <text x="16" y="46" fill="#a8a097" font-family="Inter Tight, sans-serif" font-size="11">
      SM-2 simplified · drill vs review
    </text>
  </g>
  <g transform="translate(380,320)">
    <rect width="360" height="60" rx="10" fill="#1a2230" stroke="#2a3344" />
    <text x="16" y="26" fill="#ff8a4c" font-family="JetBrains Mono, monospace" font-size="12" font-weight="600">
      GET /api/auth · requireUser
    </text>
    <text x="16" y="46" fill="#a8a097" font-family="Inter Tight, sans-serif" font-size="11">
      HMAC cookie · userId isolation
    </text>
  </g>
  <g transform="translate(380,390)">
    <rect width="360" height="60" rx="10" fill="#1a2230" stroke="#2a3344" />
    <text x="16" y="26" fill="#ff8a4c" font-family="JetBrains Mono, monospace" font-size="12" font-weight="600">
      /api/checkin · /api/leaderboard
    </text>
    <text x="16" y="46" fill="#a8a097" font-family="Inter Tight, sans-serif" font-size="11">
      checkin-snapshot three-bucket semantics
    </text>
  </g>

  <!-- Data layer -->
  <g transform="translate(780,180)">
    <rect width="380" height="270" rx="12" fill="#1a2230" stroke="#2a3344" />
    <text x="20" y="32" fill="#ff8a4c" font-family="JetBrains Mono, monospace" font-size="13" font-weight="600">
      Prisma 6
    </text>
    <text x="20" y="56" fill="#a8a097" font-family="Inter Tight, sans-serif" font-size="12">
      SQLite (dev) · PostgreSQL (prod via docker entrypoint)
    </text>

    <line x1="20" y1="74" x2="360" y2="74" stroke="#2a3344" />

    <text x="20" y="100" fill="#e9e2d1" font-family="JetBrains Mono, monospace" font-size="12">
      User · Invitation · UserSettings
    </text>
    <text x="20" y="124" fill="#e9e2d1" font-family="JetBrains Mono, monospace" font-size="12">
      Wordbook · Word · UserWord
    </text>
    <text x="20" y="148" fill="#e9e2d1" font-family="JetBrains Mono, monospace" font-size="12">
      Session · Attempt · Checkin
    </text>

    <text x="20" y="190" fill="#5c544a" font-family="JetBrains Mono, monospace" font-size="11" letter-spacing="2">
      QUERIES
    </text>
    <text x="20" y="214" fill="#a8a097" font-family="Inter Tight, sans-serif" font-size="12">
      prisma.session.findMany({ where: { userId } })
    </text>
    <text x="20" y="234" fill="#a8a097" font-family="Inter Tight, sans-serif" font-size="12">
      prisma.attempt.upsert(...)
    </text>
    <text x="20" y="254" fill="#a8a097" font-family="Inter Tight, sans-serif" font-size="12">
      prisma.$transaction([...])
    </text>
  </g>

  <!-- arrows -->
  <g stroke="url(#ember)" stroke-width="2" fill="none" marker-end="url(#arrow)">
    <path d="M320 230 L380 210" />
    <path d="M320 260 L380 280" />
    <path d="M320 290 L380 350" />
    <path d="M320 320 L380 420" />
    <path d="M740 210 L780 220" />
    <path d="M740 280 L780 270" />
    <path d="M740 350 L780 320" />
    <path d="M740 420 L780 370" />
  </g>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M0 0 L10 5 L0 10 z" fill="#ff8a4c" />
    </marker>
  </defs>

  <!-- footer legend -->
  <g transform="translate(40,500)">
    <rect width="1120" height="100" rx="12" fill="#1a2230" stroke="#2a3344" />
    <text x="20" y="32" fill="#ff8a4c" font-family="JetBrains Mono, monospace" font-size="12" font-weight="600">
      INVARIANTS
    </text>
    <text x="20" y="58" fill="#e9e2d1" font-family="Inter Tight, sans-serif" font-size="13">
      ① All per-user queries must include <tspan font-family="JetBrains Mono, monospace" fill="#ff8a4c">where: { userId }</tspan>
    </text>
    <text x="20" y="78" fill="#e9e2d1" font-family="Inter Tight, sans-serif" font-size="13">
      ② <tspan font-family="JetBrains Mono, monospace" fill="#ff8a4c">mode = "review"</tspan> never mutates Word.attempts / level / masteredAt
    </text>
  </g>
</svg>