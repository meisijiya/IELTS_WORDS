<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 560" role="img" aria-label="Flash then Spell 时序示意图">
  <rect width="900" height="560" fill="#0f141b" rx="16" />
  <text x="40" y="48" fill="#ff8a4c" font-family="JetBrains Mono, monospace" font-size="13" font-weight="600">
    FLASH-THEN-SPELL · TIMING
  </text>
  <text x="40" y="76" fill="#e9e2d1" font-family="Newsreader, serif" font-size="22" font-weight="600">
    中文释义浮现 → 英文渐隐 → 键盘复原
  </text>

  <!-- Frame 1: show -->
  <g transform="translate(40,140)">
    <rect width="260" height="200" rx="10" fill="#1a2230" stroke="#2a3344" />
    <text x="20" y="30" fill="#ff8a4c" font-family="JetBrains Mono, monospace" font-size="11">t = 0</text>
    <text x="20" y="80" fill="#e9e2d1" font-family="Newsreader, serif" font-size="42" font-weight="600">attitude</text>
    <text x="20" y="118" fill="#a8a097" font-family="Inter Tight, sans-serif" font-size="14">n. 态度；看法</text>
    <text x="20" y="160" fill="#5c544a" font-family="JetBrains Mono, monospace" font-size="11">
      audio: US+UK 双口音（闪现阶段）
    </text>
  </g>

  <!-- Frame 2: fade -->
  <g transform="translate(320,140)">
    <rect width="260" height="200" rx="10" fill="#1a2230" stroke="#2a3344" />
    <text x="20" y="30" fill="#ff8a4c" font-family="JetBrains Mono, monospace" font-size="11">t = flashMs · 渐隐</text>
    <text x="20" y="80" fill="#e9e2d1" font-family="Newsreader, serif" font-size="42" font-weight="600" opacity="0.35">attitude</text>
    <text x="20" y="118" fill="#a8a097" font-family="Inter Tight, sans-serif" font-size="14" opacity="0.7">n. 态度；看法</text>
    <text x="20" y="160" fill="#5c544a" font-family="JetBrains Mono, monospace" font-size="11">
      audio 二次播放（反馈阶段）
    </text>
  </g>

  <!-- Frame 3: input -->
  <g transform="translate(600,140)">
    <rect width="260" height="200" rx="10" fill="#1a2230" stroke="#2a3344" />
    <text x="20" y="30" fill="#ff8a4c" font-family="JetBrains Mono, monospace" font-size="11">t = 输入中</text>
    <text x="20" y="80" fill="#ff8a4c" font-family="JetBrains Mono, monospace" font-size="42" font-weight="600">
      attitu__
    </text>
    <text x="20" y="118" fill="#a8a097" font-family="Inter Tight, sans-serif" font-size="14">键盘拼写复原</text>
    <text x="20" y="160" fill="#5c544a" font-family="JetBrains Mono, monospace" font-size="11">
      新词 2 字母提示；复习词 1 字母
    </text>
  </g>

  <!-- arrow timeline -->
  <g transform="translate(40,380)">
    <line x1="0" y1="20" x2="820" y2="20" stroke="#ff8a4c" stroke-width="2" />
    <circle cx="40" cy="20" r="6" fill="#ff8a4c" />
    <text x="40" y="56" fill="#a8a097" font-family="JetBrains Mono, monospace" font-size="11" text-anchor="middle">
      显示
    </text>
    <circle cx="280" cy="20" r="6" fill="#ff8a4c" />
    <text x="280" y="56" fill="#a8a097" font-family="JetBrains Mono, monospace" font-size="11" text-anchor="middle">
      flashMs 渐隐
    </text>
    <circle cx="540" cy="20" r="6" fill="#ff8a4c" />
    <text x="540" y="56" fill="#a8a097" font-family="JetBrains Mono, monospace" font-size="11" text-anchor="middle">
      FADE_MS 隐藏
    </text>
    <circle cx="780" cy="20" r="6" fill="#ff8a4c" />
    <text x="780" y="56" fill="#a8a097" font-family="JetBrains Mono, monospace" font-size="11" text-anchor="middle">
      用户提交
    </text>
  </g>

  <!-- state note -->
  <g transform="translate(40,470)">
    <rect width="820" height="60" rx="10" fill="#1a2230" stroke="#2a3344" />
    <text x="20" y="30" fill="#ff8a4c" font-family="JetBrains Mono, monospace" font-size="12" font-weight="600">
      SM-2 简化
    </text>
    <text x="160" y="30" fill="#e9e2d1" font-family="Inter Tight, sans-serif" font-size="13">
      level = min(5, level+1) on correct · level = 0 on mastered+wrong · 5 连击升 level=5
    </text>
  </g>
</svg>